name: Run Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: 📦 Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: '3.8.6'

      - name: 🧪 Run Tests
        run: mvn clean test

      - name: 📤 Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: test-output/  # or target/surefire-reports or allure-results, depending on your setup
